<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipCoin Game</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        #result { margin-top: 20px; font-size: 1.5em; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; margin: 10px; }
        .player-result { margin-top: 20px; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>FlipCoin Game</h1>
    <button onclick="flipCoin(1)">Flip Coin (Player 1)</button>
    <button onclick="flipCoin(2)">Flip Coin (Player 2)</button>

    <p id="result">Click to flip the coin.</p>
    <div class="player-result" id="player1-result">Player 1 Last Round: -</div>
    <div class="player-result" id="player2-result">Player 2 Last Round: -</div>
    <div class="player-result" id="game-result">Game Result: -</div>

    <script>
        let player1Result = null;
        let player2Result = null;

        function flipCoin(player) {
            let outcome = Math.random() < 0.5 ? 0 : 100;
            
            // Update the results based on the player who flipped
            if (player === 1) {
                player1Result = outcome;
                document.getElementById("player1-result").innerText = "Player 1 Last Round: " + outcome;
            } else if (player === 2) {
                player2Result = outcome;
                document.getElementById("player2-result").innerText = "Player 2 Last Round: " + outcome;
            }

            // Determine the winner if both players have flipped
            if (player1Result !== null && player2Result !== null) {
                let gameOutcome = '';
                if (player1Result > player2Result) {
                    gameOutcome = 'Player 1 Wins!';
                } else if (player1Result < player2Result) {
                    gameOutcome = 'Player 2 Wins!';
                } else {
                    gameOutcome = 'It\'s a Tie!';
                }

                document.getElementById("game-result").innerText = "Game Result: " + gameOutcome;
            }

            // Display a general message with the most recent flip result
            document.getElementById("result").innerText = "Last Flip: " + (outcome === 0 ? "0" : "100");
        }
    </script>
</body>
</html>
