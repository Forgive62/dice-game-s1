<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipCoin Game</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        #result { margin-top: 20px; font-size: 1.5em; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; margin: 10px; }
        .player-result { margin-top: 20px; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>FlipCoin Game</h1>
    <button onclick="flipCoin()">Flip Coin (Player 1)</button>

    <p id="result">Click to flip the coin.</p>
    <div class="player-result" id="player1-result">Player 1 Last Round: -</div>
    <div class="player-result" id="player2-result">Player 2 (Computer) Last Round: -</div>
    <div class="player-result" id="game-result">Game Result: -</div>

    <script>
        let player1Result = null;
        let player2Result = null;
        let player1Flipped = false;
        let player2Flipped = false;

        function flipCoin() {
            // Player 1's turn to flip
            let player1Outcome = Math.random() < 0.5 ? 0 : 100;
            player1Result = player1Outcome;
            player1Flipped = true;
            document.getElementById("player1-result").innerText = "Player 1 Last Round: " + player1Outcome;

            // Computer (Player 2) automatically flips after Player 1
            setTimeout(function() {
                let player2Outcome = Math.random() < 0.5 ? 0 : 100;
                player2Result = player2Outcome;
                player2Flipped = true;
                document.getElementById("player2-result").innerText = "Player 2 (Computer) Last Round: " + player2Outcome;

                // Determine the result only after both players have flipped
                if (player1Flipped && player2Flipped) {
                    let gameOutcome = '';
                    if (player1Result > player2Result) {
                        gameOutcome = 'Player 1 Wins!';
                    } else if (player1Result < player2Result) {
                        gameOutcome = 'Player 2 (Computer) Wins!';
                    } else {
                        gameOutcome = 'It\'s a Tie!';
                    }

                    document.getElementById("game-result").innerText = "Game Result: " + gameOutcome;

                    // Reset for the next round
                    player1Flipped = false;
                    player2Flipped = false;
                }
            }, 1000); // Delay for Player 2 flip for smooth gameplay
        }
    </script>
</body>
</html>
