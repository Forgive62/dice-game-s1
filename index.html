<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        #game-list {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
            width: 90%;
            max-width: 400px;
        }
        .game-item {
            background: #007bff;
            color: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .game-item:hover {
            background: #0056b3;
        }
        .dark-mode {
            background-color: #222;
            color: #fff;
        }
        .dark-mode #game-list {
            background: #333;
            color: #fff;
        }
        #dark-mode-toggle {
            margin: 20px;
            padding: 10px;
            cursor: pointer;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Game Hub</h1>
    <button id="dark-mode-toggle">Toggle Dark Mode</button>
    <div id="game-list">
        <h2>Available Games</h2>
        <a href="madice.html" class="game-item">🎲 Madice - Play Now</a>
        <a href="coinflip.html" class="game-item">💰 FlipCoin - Play Now</a>
        <a href="truthordare.html" class="game-item">🔥 Truth or Dare - Play Now</a>
    </div>
    <script>
        document.getElementById('dark-mode-toggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
        });
    </script>
</body>
</html>
