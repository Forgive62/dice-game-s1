<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Dice Game</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        #result { margin-top: 20px; font-size: 1.2em; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Two Dice Game</h1>
    <button onclick="rollDice()">Roll Dice</button>
    <p id="result">Press the button to roll the dice.</p>

    <script>
        function rollDice() {
            fetch("https://your-backend-url/roll")  // Replace with your actual backend URL
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerHTML = 
                        `Player ${data.current_player} rolled ${data.die1} and ${data.die2} (Total: ${data.total})<br>${data.result}`;
                })
                .catch(error => {
                    document.getElementById("result").innerHTML = "Error: Unable to connect to the server.";
                });
        }
    </script>
</body>
</html>
