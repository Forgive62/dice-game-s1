<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        #game-list {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
            width: 90%;
            max-width: 400px;
        }
        .game-item {
            background: #007bff;
            color: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .game-item:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Welcome to Game Hub</h1>
    <div id="game-list">
        <h2>Available Games</h2>
        <a href="madice.html" class="game-item">🎲 Madice - Play Now</a>
    </div>
</body>
</html>
