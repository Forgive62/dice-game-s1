<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            padding: 20px;
        }
        #game-container {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.1);
            display: inline-block;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background: #ff4757;
            color: white;
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
        .btn:hover {
            background: #e84118;
        }
        #scoreboard {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🔥 Truth or Dare 🔥</h1>
    <div id="setup">
        <h2>Enter Number of Players</h2>
        <input type="number" id="player-count" min="2" max="10" placeholder="Number of players">
        <button class="btn" onclick="startGame()">Start</button>
    </div>
    <div id="game-container" style="display: none;">
        <h2 id="current-player"></h2>
        <h3 id="question">Ready to play?</h3>
        <button class="btn" onclick="generateTruth()">Truth</button>
        <button class="btn" onclick="generateDare()">Dare</button>
        <button class="btn" onclick="skipTurn()">Skip (-1 Point)</button>
        <div id="scoreboard"></div>
    </div>
    
    <script>
        let players = [];
        let scores = {};
        let currentPlayerIndex = 0;

        function startGame() {
            let count = document.getElementById('player-count').value;
            if (count < 2 || count > 10) {
                alert("Please enter a valid number of players (2-10)");
                return;
            }
            for (let i = 0; i < count; i++) {
                let name = prompt("Enter name for Player " + (i + 1));
                players.push(name || `Player ${i + 1}`);
                scores[players[i]] = 0;
            }
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            updatePlayer();
        }

        function updatePlayer() {
            document.getElementById('current-player').innerText = `It's ${players[currentPlayerIndex]}'s turn!`;
            updateScoreboard();
        }

        function updateScoreboard() {
            let scoreboard = '<h3>Scoreboard</h3><ul>';
            players.forEach(player => {
                scoreboard += `<li>${player}: ${scores[player]} points</li>`;
            });
            scoreboard += '</ul>';
            document.getElementById('scoreboard').innerHTML = scoreboard;
        }

        function nextPlayer() {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            updatePlayer();
        }

        const truths = [
            "What's the most embarrassing thing you've ever done?",
            "Have you ever had a secret crush on someone here?",
            "What's your deepest fantasy?",
            "What's the wildest thing you've ever done?",
            "Have you ever lied to get out of trouble?",
            "What's the weirdest dream you've ever had?",
            "Have you ever sent a risky text?",
            "What's one thing you've never told anyone?"
        ];

        const dares = [
            "Send a flirty message to your crush.",
            "Take off one piece of clothing (your choice).",
            "Whisper something naughty to the person next to you.",
            "Let someone give you a dare of their choice.",
            "Do your best imitation of a romantic movie scene.",
            "Text your ex something random.",
            "Eat a spoonful of something spicy.",
            "Sing a song in a funny voice."
        ];

        function generateTruth() {
            document.getElementById('question').innerText = truths[Math.floor(Math.random() * truths.length)];
            scores[players[currentPlayerIndex]] += 1;
            nextPlayer();
        }

        function generateDare() {
            document.getElementById('question').innerText = dares[Math.floor(Math.random() * dares.length)];
            scores[players[currentPlayerIndex]] += 2;
            nextPlayer();
        }

        function skipTurn() {
            scores[players[currentPlayerIndex]] -= 1;
            nextPlayer();
        }
    </script>
</body>
</html>
